version: '3.8'

services:
  neon-os:
    build: .
    container_name: neon-os-container
    stdin_open: true
    tty: true
    working_dir: /neon-os
    volumes:
      - ./storage:/neon-os/storage
      - ./realms:/neon-os/realms
    environment:
      - TERM=xterm-256color
    networks:
      - neon-network

networks:
  neon-network:
    driver: bridge
