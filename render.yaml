services:
  # Service Web principal pour NEON OS avec Alpine optimisé
  - type: web
    name: neon-os
    env: docker
    repo: https://github.com/Archlord12345/CRAFTOS-ONLINE
    rootDir: .
    dockerfilePath: ./minimal-dockerfiles/Dockerfile.alpine
    dockerContext: .
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 8000
      - key: PYTHONPATH
        value: /app

  # Service VNC avec véritable KDE Plasma Desktop
  - type: pserv
    name: neon-os-kde-real
    env: docker
    repo: https://github.com/Archlord12345/CRAFTOS-ONLINE
    rootDir: .
    dockerfilePath: ./minimal-dockerfiles/Dockerfile.kde-real
    dockerContext: .
    plan: starter
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DISPLAY
        value: :1
      - key: GEOMETRY
        value: 1920x1080
      - key: DEPTH
        value: 24

  # Service de backup avec Debian Slim
  - type: web
    name: neon-os-backup
    env: docker
    repo: https://github.com/Archlord12345/CRAFTOS-ONLINE
    rootDir: .
    dockerfilePath: ./minimal-dockerfiles/Dockerfile.slim
    dockerContext: .
    plan: free
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 8000
