services:
  # Service Web principal pour NEON OS avec Alpine optimisé
  - type: web
    name: neon-os
    env: docker
    repo: https://github.com/Archlord12345/CRAFTOS-ONLINE
    rootDir: .
    dockerfilePath: ./minimal-dockerfiles/Dockerfile.alpine
    dockerContext: .
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 8000
      - key: PYTHONPATH
        value: /app

  # Service KDE avec interface graphique complète
  - type: web
    name: neon-os-kde
    env: docker
    repo: https://github.com/Archlord12345/CRAFTOS-ONLINE
    rootDir: .
    dockerfilePath: ./minimal-dockerfiles/Dockerfile.kde
    dockerContext: .
    plan: starter
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DISPLAY
        value: :99
      - key: QT_QPA_PLATFORM
        value: offscreen

  # Service VNC pour accès bureau distant
  - type: pserv
    name: neon-os-vnc
    env: docker
    repo: https://github.com/Archlord12345/CRAFTOS-ONLINE
    rootDir: .
    dockerfilePath: ./minimal-dockerfiles/Dockerfile.kde
    dockerContext: .
    plan: starter
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DISPLAY
        value: :99

  # Service de backup avec Debian Slim
  - type: web
    name: neon-os-backup
    env: docker
    repo: https://github.com/Archlord12345/CRAFTOS-ONLINE
    rootDir: .
    dockerfilePath: ./minimal-dockerfiles/Dockerfile.slim
    dockerContext: .
    plan: free
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 8000
